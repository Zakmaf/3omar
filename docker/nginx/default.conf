server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Sécurité — masquer la version du serveur
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Ressources statiques : cache navigateur
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Toutes les requêtes → index.php (routeur Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Passer PHP à PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Transmission de l'IP réelle (si derrière un proxy/load balancer)
        fastcgi_param  HTTP_X_REAL_IP $remote_addr;
    }

    # Refuser l'accès aux fichiers cachés (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Refuser l'accès direct au dossier storage (sauf public)
    location ~ ^/storage/(?!app/public) {
        deny all;
    }
}
