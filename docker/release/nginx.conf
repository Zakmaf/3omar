server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Logs vers stdout/stderr (conventions des conteneurs)
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Sécurité — masquer la version du serveur
    server_tokens off;

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Ressources statiques : cache navigateur
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Toutes les requêtes → index.php (routeur Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Passer PHP à PHP-FPM (même conteneur)
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # Refuser l'accès aux fichiers cachés (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Refuser l'accès direct au dossier storage (sauf public)
    location ~ ^/storage/(?!app/public) {
        deny all;
    }
}
