name: "🐞 Rapport de bug"
description: Signaler un comportement incorrect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler un bug. Vérifiez d'abord qu'une issue similaire n'existe pas déjà.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Qu'attendiez-vous à la place ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: Étapes précises pour reproduire le problème.
      placeholder: |
        1. Aller sur …
        2. Saisir …
        3. Cliquer sur …
        4. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: calcul
    attributes:
      label: Scénario de calcul (si bug de calcul)
      description: >
        Valeurs d'entrée et résultat attendu vs obtenu. Un bug de calcul doit pouvoir
        être traduit en test reproductible (voir docs/CALCUL.md).
  - type: input
    id: version
    attributes:
      label: Version / environnement
      description: Tag d'image, navigateur, langue d'affichage…
      placeholder: "ghcr.io/zakmaf/3omar:v1.2.1 — Firefox — fr"
  - type: textarea
    id: contexte
    attributes:
      label: Contexte additionnel
      description: Captures d'écran, logs, etc.
