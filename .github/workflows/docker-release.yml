name: Publier l'image Docker sur GHCR

# Publication uniquement depuis une release GitHub (standard commun, section 8).
# Pas de workflow_dispatch : sans contexte de release, la règle `latest`
# ci-dessous s'évaluerait vraie et pousserait `latest`.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stable : vX.Y.Z, release non marquée pré-release.
      # Développement : vX.Y.Z-dev.N, release marquée pré-release.
      # Tout autre couple tag/drapeau échoue avant de construire quoi que ce soit.
      - name: Vérifier le tag et le type de release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            motif='^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[1-9][0-9]*$'
          else
            motif='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq "$motif"; then
            echo "::error::Tag ${TAG} invalide pour une release (pré-release : ${PRERELEASE}). Attendu : vX.Y.Z (stable) ou vX.Y.Z-dev.N (pré-release)."
            exit 1
          fi

      - name: Authentification GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées et tags de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=raw,value=dev,enable=${{ github.event.release.prerelease }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build et push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/release/Dockerfile
          push: true
          pull: true
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
