name: Publier l'image Docker sur GHCR

# Publication uniquement depuis une release GitHub (standard commun, section 8).
# Pas de workflow_dispatch : sans contexte de release, la règle `latest`
# ci-dessous s'évaluerait vraie et pousserait `latest`.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stable : vX.Y.Z, release non marquée pré-release.
      # Développement : vX.Y.Z-dev.N, release marquée pré-release.
      # Tout autre couple tag/drapeau échoue avant de construire quoi que ce soit.
      - name: Vérifier le tag et le type de release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            motif='^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[1-9][0-9]*$'
          else
            motif='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq "$motif"; then
            echo "::error::Tag ${TAG} invalide pour une release (pré-release : ${PRERELEASE}). Attendu : vX.Y.Z (stable) ou vX.Y.Z-dev.N (pré-release)."
            exit 1
          fi

      - name: Authentification GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags OCI par mode (#288) :
      # - stable vX.Y.Z      : vX.Y.Z, vX.Y, vX, latest ;
      # - pré-release vX.Y.Z-dev.N : vX.Y.Z-dev.N et dev, rien d'autre.
      # Pour une version semver pré-release, metadata-action remplace tout motif
      # autre que {{raw}} par {{version}}, qui perd le préfixe v : le tag exact
      # vient donc de {{raw}} (le tag git tel quel), et les alias vX.Y / vX ne
      # sont activés qu'en stable. latest=false : latest n'est émis que par la
      # règle raw explicite, jamais ajouté automatiquement.
      # Le job CI « Tags image release » rejoue cette configuration avec la
      # vraie metadata-action pour chaque mode.
      - name: Métadonnées et tags de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=raw,value=dev,enable=${{ github.event.release.prerelease }}
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern=v{{major}},enable=${{ !github.event.release.prerelease }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Relève, avant le push, le digest des tags que cette release ne doit pas
      # toucher (absents compris), pour la vérification qui suit le push.
      - name: Capturer les tags à préserver
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: bash .github/scripts/verifier-tags-image.sh capturer "ghcr.io/${GITHUB_REPOSITORY,,}" "$TAG" "$PRERELEASE" "$RUNNER_TEMP/tags-avant.txt"

      - name: Build et push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/release/Dockerfile
          push: true
          pull: true
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Relit le registre après le push : tags publiés sur le digest poussé,
      # tags protégés inchangés. Un échec rend le run rouge ; l'image est déjà
      # poussée, l'écart est à corriger par le propriétaire (voir
      # docs/DEPLOIEMENT.md, « Tags disponibles »).
      - name: Vérifier les tags publiés
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash .github/scripts/verifier-tags-image.sh verifier "ghcr.io/${GITHUB_REPOSITORY,,}" "$TAG" "$PRERELEASE" "$RUNNER_TEMP/tags-avant.txt" "$DIGEST"
