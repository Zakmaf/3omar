name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run quotidien sur main (branche par défaut), à heure creuse UTC : un avis de
  # sécurité publié après la dernière fusion rend main rouge dans les 24 heures,
  # sans attendre une PR (#265).
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

# Le run planifié a son propre groupe : il n'annule pas un run de push sur main
# et n'est pas annulé par lui. Les groupes des push et des PR sont inchangés.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}
  cancel-in-progress: true

# Les jobs PHP s'executent dans l'image de developpement (docker/php/Dockerfile),
# qui embarque la meme version de PHP que l'image de production : la version
# testee suit le Dockerfile, sans liste a maintenir ici (#229). Les dependances
# sont installees par l'image composer, comme dans docs/DEVELOPPEMENT.md.
env:
  PHP_APP: docker run --rm -v ${{ github.workspace }}:/var/www/html -w /var/www/html --entrypoint php 3omar-app:ci
  COMPOSER: docker run --rm -v ${{ github.workspace }}:/app -w /app composer:2.10 composer

jobs:
  tests:
    name: Tests PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construire l'image de développement (docker/php/Dockerfile)
        run: docker build -f docker/php/Dockerfile -t 3omar-app:ci .

      - name: Version de PHP testée
        run: $PHP_APP -v

      - name: Préparer les dossiers runtime Laravel
        run: mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs

      - name: Installer les dépendances
        run: $COMPOSER install --prefer-dist --no-interaction --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          $PHP_APP artisan key:generate

      - name: Lancer les tests
        run: $PHP_APP vendor/bin/phpunit

  pint:
    name: Laravel Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construire l'image de développement (docker/php/Dockerfile)
        run: docker build -f docker/php/Dockerfile -t 3omar-app:ci .

      - name: Installer les dépendances
        run: $COMPOSER install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Vérifier le formatage
        run: $PHP_APP vendor/bin/pint --test

  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Auditer composer.lock
        run: $COMPOSER audit --locked --no-interaction

  release-image:
    name: Build image release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version fictive au format des pré-releases : l'étape « Vérifier /up et
      # /api/v1/health » exige que l'image l'annonce.
      - name: Construire docker/release/Dockerfile (sans push)
        run: docker build -f docker/release/Dockerfile --build-arg APP_VERSION=v0.0.0-dev.1 -t 3omar-ci:${{ github.sha }} .

      - name: Refuser une APP_VERSION hors convention
        run: |
          if sortie=$(docker build -f docker/release/Dockerfile --build-arg 'APP_VERSION=v1.2.3-nightly.1' -t 3omar-ci:invalide . 2>&1); then
            echo "::error::Le build a accepté APP_VERSION=v1.2.3-nightly.1"
            exit 1
          fi
          printf '%s\n' "$sortie" | grep 'APP_VERSION invalide'

      - name: Démarrer le conteneur avec une APP_KEY jetable
        run: |
          docker run -d --name 3omar-ci -p 127.0.0.1:8080:80 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            3omar-ci:${{ github.sha }}

      - name: Attendre le HEALTHCHECK de l'image
        run: |
          for i in $(seq 1 36); do
            status=$(docker inspect -f '{{.State.Health.Status}}' 3omar-ci)
            echo "Essai $i : $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 5
          done
          echo "Le conteneur n'est pas devenu healthy dans le délai."
          docker logs 3omar-ci
          exit 1

      - name: Vérifier /up et /api/v1/health
        run: |
          for path in /up /api/v1/health; do
            code=$(curl -sS -o /tmp/reponse -w '%{http_code}' --max-time 10 "http://127.0.0.1:8080${path}")
            echo "${path} : HTTP ${code}"
            cat /tmp/reponse; echo
            if [ "$code" != "200" ]; then
              docker logs 3omar-ci
              exit 1
            fi
          done
          grep -q '"status":"ok"' /tmp/reponse
          grep -q '"version":"v0.0.0-dev.1"' /tmp/reponse

      - name: Vérifier les en-têtes de sécurité (une seule fois, X-Frame-Options DENY)
        run: |
          echoue=0
          for path in / /api/v1/health /img/app_icon_32.png; do
            curl -sS -o /dev/null -D /tmp/entetes --max-time 10 "http://127.0.0.1:8080${path}"
            echo "== ${path}"
            grep -i -E '^(HTTP/|x-content-type-options:|x-frame-options:|referrer-policy:)' /tmp/entetes || true
            for entete in x-content-type-options x-frame-options referrer-policy; do
              n=$(grep -c -i "^${entete}:" /tmp/entetes || true)
              if [ "$n" != "1" ]; then
                echo "::error::${path} : ${entete} présent ${n} fois au lieu d'une"
                echoue=1
              fi
            done
            if ! grep -q -i -E '^x-frame-options: DENY' /tmp/entetes; then
              echo "::error::${path} : X-Frame-Options différent de DENY"
              echoue=1
            fi
          done

          # Referrer-Policy (#283) : les routes calculator.* portent des montants
          # (?s=, ?a=, ?b=) ; aucune ne doit transmettre de référent, y compris
          # sur une redirection. Les autres réponses (éditorial, API, statiques)
          # gardent strict-origin-when-cross-origin. Un seul en-tête chaque fois,
          # tel que servi par Nginx dans l'image release.
          verifier_referent() {
            cible="$1"; statut_attendu="$2"; politique="$3"
            statut=$(curl -sS -o /dev/null -D /tmp/entetes -w '%{http_code}' --max-time 10 "http://127.0.0.1:8080${cible}")
            tr -d '\r' < /tmp/entetes > /tmp/entetes-lf
            echo "== ${cible} : HTTP ${statut}"
            grep -i '^referrer-policy:' /tmp/entetes-lf || true
            if [ "$statut" != "$statut_attendu" ]; then
              echo "::error::${cible} : HTTP ${statut} au lieu de ${statut_attendu}"
              echoue=1
            fi
            n=$(grep -c -i '^referrer-policy:' /tmp/entetes-lf || true)
            if [ "$n" != "1" ]; then
              echo "::error::${cible} : Referrer-Policy présent ${n} fois au lieu d'une"
              echoue=1
            fi
            if ! grep -q -i -x "referrer-policy: ${politique}" /tmp/entetes-lf; then
              echo "::error::${cible} : Referrer-Policy différent de ${politique}"
              echoue=1
            fi
          }
          verifier_referent '/calculateur' 200 no-referrer
          verifier_referent '/calculateur?s=invalide' 200 no-referrer
          verifier_referent '/calculateur/comparer?a=x&b=y' 302 no-referrer
          verifier_referent '/calculateur/gain-2027?s=invalide' 302 no-referrer
          verifier_referent '/' 200 strict-origin-when-cross-origin
          verifier_referent '/documentation' 200 strict-origin-when-cross-origin
          verifier_referent '/api/v1/health' 200 strict-origin-when-cross-origin
          verifier_referent '/img/app_icon_32.png' 200 strict-origin-when-cross-origin
          exit $echoue

      # Le pair vu par Nginx est la passerelle du réseau Docker (172.16.0.0/12),
      # donc un proxy de confiance pour docker/release/nginx.conf : il joue ici le
      # rôle de Cloudflare ou de Traefik devant le conteneur.
      - name: Vérifier la redirection HTTPS derrière un proxy de confiance
        run: |
          echoue=0
          verifier() {
            attendu="$1"; shift
            code=$(curl -sS -o /dev/null -D /tmp/entetes -w '%{http_code}' --max-time 10 \
              -H 'Host: 3omar.example' "$@" 'http://127.0.0.1:8080/documentation?source=ci')
            echo "== $* : HTTP ${code}"
            grep -i '^location:' /tmp/entetes || true
            if [ "$code" != "$attendu" ]; then
              echo "::error::$* : HTTP ${code} au lieu de ${attendu}"
              echoue=1
            fi
          }
          verifier 301 -H 'X-Forwarded-Proto: http'
          if ! grep -q -i -x 'location: https://3omar.example/documentation?source=ci' <(tr -d '\r' < /tmp/entetes); then
            echo "::error::X-Forwarded-Proto: http : Location différent de https://3omar.example/documentation?source=ci"
            echoue=1
          fi
          verifier 200 -H 'X-Forwarded-Proto: https'
          verifier 200
          exit $echoue

      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f 3omar-ci || true

  # Tags OCI de la publication (#288). Rejoue la vraie génération de
  # docker/metadata-action avec la configuration lue dans docker-release.yml,
  # pour chaque mode de release, sans rien construire ni pousser. Le tag de
  # release est simulé par un tag git local sur un commit vide du runner,
  # jamais poussé (persist-credentials: false).
  release-tags:
    name: Tags image release (${{ matrix.cas }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - cas: stable
            tag: v3.7.0
            prerelease: 'false'
            attendus: 'latest v3 v3.7 v3.7.0'
          - cas: pré-release
            tag: v3.7.0-dev.1
            prerelease: 'true'
            attendus: 'dev v3.7.0-dev.1'
          - cas: pré-release N à deux chiffres
            tag: v3.8.0-dev.12
            prerelease: 'true'
            attendus: 'dev v3.8.0-dev.12'
    env:
      WORKFLOW_RELEASE: .github/workflows/docker-release.yml
      # Même SHA que l'étape « Métadonnées et tags de l'image » de
      # docker-release.yml : l'étape d'extraction échoue s'ils divergent.
      METADATA_ACTION: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
      TAG: ${{ matrix.tag }}
      PRERELEASE: ${{ matrix.prerelease }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Contrat du déclencheur : release publiée seulement, sans
      # workflow_dispatch ni autre déclencheur. Contrat de version : APP_VERSION
      # reçoit le nom du tag de release, indépendamment des tags OCI générés.
      # Les expressions attendues sont écrites "${d}{{" : un dollar suivi de deux
      # accolades serait évalué par GitHub dans le script lui-même.
      - name: Vérifier le déclencheur et APP_VERSION de docker-release.yml
        run: |
          d='$'
          echoue=0
          if ! yq -o=json '.on' "$WORKFLOW_RELEASE" | jq -e 'keys == ["release"] and .release.types == ["published"]' > /dev/null; then
            echo "::error::${WORKFLOW_RELEASE} doit se déclencher uniquement sur release publiée"
            echoue=1
          fi
          if grep -nE '^[[:space:]]*workflow_dispatch[[:space:]]*:' "$WORKFLOW_RELEASE"; then
            echo "::error::${WORKFLOW_RELEASE} ne doit pas déclarer workflow_dispatch"
            echoue=1
          fi
          build_args=$(yq -r '.jobs."build-and-push".steps[] | select((.uses // "") | test("^docker/build-push-action@")) | .with."build-args"' "$WORKFLOW_RELEASE")
          attendu="APP_VERSION=${d}{{github.event.release.tag_name}}"
          if [ "$(printf '%s' "$build_args" | tr -d '[:space:]')" != "$attendu" ]; then
            echo "::error::build-args doit être exactement ${attendu} (reçu : ${build_args})"
            echoue=1
          fi
          exit $echoue

      # Remplace seulement les deux expressions de mode connues ; toute autre
      # expression restante fait échouer le test plutôt que d'être devinée.
      - name: Extraire la configuration de metadata-action pour ce mode
        id: config
        run: |
          d='$'
          etape='.jobs."build-and-push".steps[] | select(.id == "meta")'
          uses=$(yq -r "$etape | .uses" "$WORKFLOW_RELEASE")
          if [ "$uses" != "$METADATA_ACTION" ]; then
            echo "::error::metadata-action de ${WORKFLOW_RELEASE} (${uses}) différente de celle du test (${METADATA_ACTION})"
            exit 1
          fi
          if [ "$PRERELEASE" = true ]; then non=false; else non=true; fi
          substituer() {
            local texte="$1"
            texte=${texte//"${d}{{ !github.event.release.prerelease }}"/$non}
            texte=${texte//"${d}{{ github.event.release.prerelease }}"/$PRERELEASE}
            printf '%s' "$texte"
          }
          tags=$(substituer "$(yq -r "$etape | .with.tags // \"\"" "$WORKFLOW_RELEASE")")
          flavor=$(substituer "$(yq -r "$etape | .with.flavor // \"\"" "$WORKFLOW_RELEASE")")
          if printf '%s\n%s\n' "$tags" "$flavor" | grep -F "${d}{{"; then
            echo "::error::Expression non prise en charge par le test dans tags/flavor de ${WORKFLOW_RELEASE}"
            exit 1
          fi
          printf 'tags (%s) :\n%s\nflavor :\n%s\n' "$TAG" "$tags" "$flavor"
          {
            echo 'tags<<FIN_TAGS'
            printf '%s\n' "$tags"
            echo 'FIN_TAGS'
            echo 'flavor<<FIN_FLAVOR'
            printf '%s\n' "$flavor"
            echo 'FIN_FLAVOR'
          } >> "$GITHUB_OUTPUT"

      # HEAD détaché sur un commit vide portant seul le tag : metadata-action
      # (context: git) lit alors refs/tags/<tag> comme sur une release.
      - name: Simuler le tag de release (git local, jamais poussé)
        run: |
          git checkout --quiet --detach
          git -c user.name=ci -c user.email=ci@example.invalid commit --quiet --allow-empty -m "release simulée ${TAG}"
          git tag "$TAG"
          git show -s --pretty='%D'

      - name: Générer les tags avec docker/metadata-action
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.config.outputs.tags }}
          flavor: ${{ steps.config.outputs.flavor }}

      - name: Comparer aux tags attendus
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
          ATTENDUS: ${{ matrix.attendus }}
        run: |
          printf '%s\n' "$META_JSON" | jq -r '.tags[]'
          image_attendue="ghcr.io/${GITHUB_REPOSITORY,,}"
          images=$(printf '%s\n' "$META_JSON" | jq -r '.tags[] | sub(":[^:]*$"; "")' | sort -u)
          if [ "$images" != "$image_attendue" ]; then
            echo "::error::Image attendue ${image_attendue}, obtenue : ${images}"
            exit 1
          fi
          # Comparaison d'ensembles : un tag répété ne pousse qu'une référence.
          # Les doublons sont signalés sans faire échouer le test.
          doublons=$(printf '%s\n' "$META_JSON" | jq -r '.tags[] | sub("^.*:"; "")' | sort | uniq -d | xargs)
          if [ -n "$doublons" ]; then
            echo "::notice::Tags générés plusieurs fois par metadata-action : ${doublons}"
          fi
          obtenus=$(printf '%s\n' "$META_JSON" | jq -r '.tags[] | sub("^.*:"; "")' | sort -u | xargs)
          attendus=$(printf '%s\n' $ATTENDUS | sort -u | xargs)
          echo "Release ${TAG} (pré-release : ${PRERELEASE})"
          echo "  attendus : ${attendus}"
          echo "  obtenus  : ${obtenus}"
          if [ "$obtenus" != "$attendus" ]; then
            echo "::error::Tags OCI de ${TAG} (pré-release : ${PRERELEASE}) : attendus « ${attendus} », obtenus « ${obtenus} »"
            exit 1
          fi

  # Vérification post-publication (#288) : .github/scripts/verifier-tags-image.sh
  # contre des registres locaux jetables, sans aucun accès à GHCR :
  # - scénarios conformes et fautifs des deux modes, code de sortie exact ;
  # - lectures impossibles réelles (port sans registre, registre protégé
  #   interrogé sans identifiants) : code 2, jamais un tag déclaré absent ;
  # - chaîne réelle docker/build-push-action (provenance par défaut) vers le
  #   registre local, puis capturer / verifier avec steps.build.outputs.digest.
  release-tags-verification:
    name: Vérification post-publication des tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    env:
      IMAGE_REELLE: localhost:5000/chaine-reelle
      TAG_REEL: v3.7.0-dev.1
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La capture des alias protégés doit précéder le push, la vérification le
      # suivre, avec le digest réellement poussé, sans continue-on-error ni
      # condition `if` (un `if: false` désactiverait la vérification).
      - name: Vérifier le câblage dans docker-release.yml
        env:
          WORKFLOW_RELEASE: .github/workflows/docker-release.yml
        run: |
          yq -o=json '.jobs."build-and-push".steps' "$WORKFLOW_RELEASE" > "$RUNNER_TEMP/etapes.json"
          if ! jq -e '
            def pos(f): ([to_entries[] | select(.value | f) | .key] | first) // -1;
            pos((.uses // "") | startswith("docker/build-push-action@")) as $b
            | pos((.run // "") | contains("verifier-tags-image.sh capturer")) as $c
            | pos((.run // "") | contains("verifier-tags-image.sh verifier")) as $v
            | $c >= 0 and $b >= 0 and $v >= 0 and $c < $b and $b < $v
              and .[$b].id == "build"
              and (.[$v].env | tostring | contains("steps.build.outputs.digest"))
              and (.[$c]["continue-on-error"] != true)
              and (.[$v]["continue-on-error"] != true)
              and (.[$c] | has("if") | not)
              and (.[$b] | has("if") | not)
              and (.[$v] | has("if") | not)
          ' "$RUNNER_TEMP/etapes.json" > /dev/null; then
            echo "::error::${WORKFLOW_RELEASE} : attendu capture (verifier-tags-image.sh capturer) avant le build id=build, puis verifier-tags-image.sh verifier après, avec steps.build.outputs.digest, sans continue-on-error ni condition if"
            jq -r '.[] | "- " + (.name // "?") + " (id: " + (.id // "-") + ")"' "$RUNNER_TEMP/etapes.json"
            exit 1
          fi

      # Registre local exigeant une authentification : l'unique entrée htpasswd
      # n'est pas une empreinte bcrypt, aucun mot de passe ne l'ouvre, et le
      # test n'en envoie aucun. /v2/ doit répondre 401 avant les scénarios.
      - name: Démarrer un registre local protégé (authentification refusée)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/registre-protege"
          printf '%s\n' 'personne:aucune-empreinte-valide' > "$RUNNER_TEMP/registre-protege/htpasswd"
          docker run -d --name 3omar-registre-protege -p 5001:5000 \
            -v "$RUNNER_TEMP/registre-protege:/auth:ro" \
            -e REGISTRY_AUTH=htpasswd \
            -e REGISTRY_AUTH_HTPASSWD_REALM=3omar-test \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:3
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:5001/v2/ || true)
            echo "Essai $i : HTTP ${code}"
            if [ "$code" = "401" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs 3omar-registre-protege
          exit 1

      # Exécutés même si le câblage manque : le RED doit montrer tous les constats.
      - name: Scénarios contre les registres locaux
        if: ${{ !cancelled() }}
        run: bash .github/scripts/test-verifier-tags-image.sh localhost:5000 localhost:5001

      # Chaîne réelle de publication, sans GHCR : setup-buildx et
      # build-push-action aux mêmes SHA que docker-release.yml, provenance par
      # défaut (index avec attestation), push vers le registre local, puis
      # capturer et verifier comme en release avec steps.build.outputs.digest.
      # Prouve que le digest renvoyé par build-push-action est celui que
      # imagetools lit pour chaque tag publié.
      - name: Préparer l'image de test FROM scratch
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/fixture-buildx"
          printf 'chaine-reelle\n' > "$RUNNER_TEMP/fixture-buildx/marqueur"
          printf 'FROM scratch\nCOPY marqueur /marqueur\n' > "$RUNNER_TEMP/fixture-buildx/Dockerfile"

      - name: Configurer Docker Buildx (accès au registre local)
        if: ${{ !cancelled() }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Capturer avant le push réel
        if: ${{ !cancelled() }}
        run: bash .github/scripts/verifier-tags-image.sh capturer "$IMAGE_REELLE" "$TAG_REEL" true "$RUNNER_TEMP/tags-avant-reel.txt"

      - name: Build et push réels vers le registre local
        id: build
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/fixture-buildx
          push: true
          tags: |
            ${{ env.IMAGE_REELLE }}:${{ env.TAG_REEL }}
            ${{ env.IMAGE_REELLE }}:dev

      - name: Vérifier les tags avec le digest de build-push-action
        if: ${{ !cancelled() }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          type=$(docker buildx imagetools inspect --raw "${IMAGE_REELLE}:${TAG_REEL}" | jq -r '.mediaType')
          echo "::notice::Manifeste publié par build-push-action : ${type}, digest ${DIGEST}"
          bash .github/scripts/verifier-tags-image.sh verifier "$IMAGE_REELLE" "$TAG_REEL" true "$RUNNER_TEMP/tags-avant-reel.txt" "$DIGEST"

      - name: Arrêter le registre protégé
        if: always()
        run: docker rm -f 3omar-registre-protege || true

  # Contrats navigateur Playwright + axe (tests/browser/contracts), avec les étapes
  # de docs/DEVELOPPEMENT.md, section "Tests navigateur". Garder l'image Playwright
  # alignée sur tests/browser/run.sh et sur la version de package-lock.json.
  browser:
    name: Tests navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer les dossiers runtime Laravel
        run: mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs

      - name: Construire l'image de développement (docker/php/Dockerfile)
        run: docker build -f docker/php/Dockerfile -t 3omar-app:latest .

      - name: Installer les dépendances PHP dans un volume dédié
        run: |
          docker run --rm -v "$PWD":/app -v 3omar_browser_vendor:/app/vendor -w /app \
            composer:2 composer install --no-interaction --no-progress --ignore-platform-req=php

      - name: Servir le dépôt sur 127.0.0.1:49222
        run: |
          docker run -d --name 3omar-browser-app --entrypoint php \
            -v "$PWD":/var/www/html -v 3omar_browser_vendor:/var/www/html/vendor \
            -w /var/www/html/public -p 127.0.0.1:49222:8000 \
            -e APP_ENV=local -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://127.0.0.1:49222 -e CACHE_STORE=array -e SESSION_DRIVER=file \
            -e PHP_CLI_SERVER_WORKERS=4 \
            3omar-app:latest -S 0.0.0.0:8000 -t /var/www/html/public \
            /var/www/html/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:49222/calculateur || true)
            echo "Essai $i : HTTP ${code}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs 3omar-browser-app
          exit 1

      - name: Installer les dépendances npm épinglées dans un volume dédié
        run: |
          docker run --rm -v "$PWD":/work -v 3omar_browser_node_modules:/work/node_modules -w /work \
            mcr.microsoft.com/playwright:v1.64.1-noble npm ci --no-audit --no-fund

      - name: Lancer les contrats navigateur
        env:
          CI: 'true'
        run: ./tests/browser/run.sh tests/browser/contracts

      - name: Journal du serveur PHP en cas d'échec
        if: failure()
        run: docker logs --tail 200 3omar-browser-app || true

      - name: Publier le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-navigateur
          path: |
            tests/browser/.report
            tests/browser/.output
          retention-days: 7
          if-no-files-found: ignore
          # .report et .output sont des dossiers cachés, exclus par défaut.
          include-hidden-files: true

      # Captures de preuve de l'exercice fiscal (#281), produites par
      # tests/browser/contracts/exercice-parcours.spec.js. Seul ce sous-dossier.
      - name: Publier les preuves visuelles de l'exercice fiscal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preuves-exercice
          path: tests/browser/.output/preuves-exercice
          retention-days: 7
          if-no-files-found: ignore
          # .output est un dossier caché, exclu par défaut.
          include-hidden-files: true

      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f 3omar-browser-app || true

  # Règle rédactionnelle d'AGENTS.md et CONTRIBUTING.md : aucun tiret cadratin
  # (U+2014) ni emoji dans les lignes ajoutées ou modifiées. Les lignes
  # existantes non touchées ne sont pas contrôlées (#226).
  style:
    name: Style rédactionnel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Vérifier les lignes ajoutées ou modifiées
        env:
          # PR : premier parent du commit de fusion testé, soit la base.
          # Push sur main : le commit qui précédait le push.
          # Run planifié : aucun commit nouveau et pas de github.event.before ;
          # HEAD comme base donne un diff vide, donc un contrôle vide et vert.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || (github.event_name == 'schedule' && 'HEAD' || github.event.before) }}
        run: bash .github/scripts/style-redactionnel.sh "$BASE"

  # Seul check exige par le ruleset protect-main. Tout nouveau job s'ajoute a
  # `needs` : la protection de main n'a jamais a changer (standard Zakmaf/engineering).
  gate:
    name: gate
    needs: [tests, pint, audit, release-image, release-tags, release-tags-verification, browser, style]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tous les jobs sont verts
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTATS"
          for r in $RESULTATS; do test "$r" = "success"; done
