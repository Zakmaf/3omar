name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Les jobs PHP s'executent dans l'image de developpement (docker/php/Dockerfile),
# qui embarque la meme version de PHP que l'image de production : la version
# testee suit le Dockerfile, sans liste a maintenir ici (#229). Les dependances
# sont installees par l'image composer, comme dans docs/DEVELOPPEMENT.md.
env:
  PHP_APP: docker run --rm -v ${{ github.workspace }}:/var/www/html -w /var/www/html --entrypoint php 3omar-app:ci
  COMPOSER: docker run --rm -v ${{ github.workspace }}:/app -w /app composer:2.10 composer

jobs:
  # Nom de check exige par le ruleset protect-main : ne pas le renommer sans
  # mettre a jour le ruleset.
  tests:
    name: Tests PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire l'image de développement (docker/php/Dockerfile)
        run: docker build -f docker/php/Dockerfile -t 3omar-app:ci .

      - name: Version de PHP testée
        run: $PHP_APP -v

      - name: Préparer les dossiers runtime Laravel
        run: mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs

      - name: Installer les dépendances
        run: $COMPOSER install --prefer-dist --no-interaction --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          $PHP_APP artisan key:generate

      - name: Lancer les tests
        run: $PHP_APP vendor/bin/phpunit

  pint:
    name: Laravel Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire l'image de développement (docker/php/Dockerfile)
        run: docker build -f docker/php/Dockerfile -t 3omar-app:ci .

      - name: Installer les dépendances
        run: $COMPOSER install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Vérifier le formatage
        run: $PHP_APP vendor/bin/pint --test

  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Auditer composer.lock
        run: $COMPOSER audit --locked --no-interaction

  release-image:
    name: Build image release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire docker/release/Dockerfile (sans push)
        run: docker build -f docker/release/Dockerfile -t 3omar-ci:${{ github.sha }} .

      - name: Démarrer le conteneur avec une APP_KEY jetable
        run: |
          docker run -d --name 3omar-ci -p 127.0.0.1:8080:80 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            3omar-ci:${{ github.sha }}

      - name: Attendre le HEALTHCHECK de l'image
        run: |
          for i in $(seq 1 36); do
            status=$(docker inspect -f '{{.State.Health.Status}}' 3omar-ci)
            echo "Essai $i : $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 5
          done
          echo "Le conteneur n'est pas devenu healthy dans le délai."
          docker logs 3omar-ci
          exit 1

      - name: Vérifier /up et /api/v1/health
        run: |
          for path in /up /api/v1/health; do
            code=$(curl -sS -o /tmp/reponse -w '%{http_code}' --max-time 10 "http://127.0.0.1:8080${path}")
            echo "${path} : HTTP ${code}"
            cat /tmp/reponse; echo
            if [ "$code" != "200" ]; then
              docker logs 3omar-ci
              exit 1
            fi
          done
          grep -q '"status":"ok"' /tmp/reponse

      - name: Vérifier les en-têtes de sécurité (une seule fois, X-Frame-Options DENY)
        run: |
          echoue=0
          for path in / /api/v1/health /img/app_icon_32.png; do
            curl -sS -o /dev/null -D /tmp/entetes --max-time 10 "http://127.0.0.1:8080${path}"
            echo "== ${path}"
            grep -i -E '^(HTTP/|x-content-type-options:|x-frame-options:|referrer-policy:)' /tmp/entetes || true
            for entete in x-content-type-options x-frame-options referrer-policy; do
              n=$(grep -c -i "^${entete}:" /tmp/entetes || true)
              if [ "$n" != "1" ]; then
                echo "::error::${path} : ${entete} présent ${n} fois au lieu d'une"
                echoue=1
              fi
            done
            if ! grep -q -i -E '^x-frame-options: DENY' /tmp/entetes; then
              echo "::error::${path} : X-Frame-Options différent de DENY"
              echoue=1
            fi
          done
          exit $echoue

      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f 3omar-ci || true

  # Contrats navigateur Playwright + axe (tests/browser/contracts), avec les étapes
  # de docs/DEVELOPPEMENT.md, section "Tests navigateur". Garder l'image Playwright
  # alignée sur tests/browser/run.sh et sur la version de package-lock.json.
  browser:
    name: Tests navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer les dossiers runtime Laravel
        run: mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs

      - name: Construire l'image de développement (docker/php/Dockerfile)
        run: docker build -f docker/php/Dockerfile -t 3omar-app:latest .

      - name: Installer les dépendances PHP dans un volume dédié
        run: |
          docker run --rm -v "$PWD":/app -v 3omar_browser_vendor:/app/vendor -w /app \
            composer:2 composer install --no-interaction --no-progress --ignore-platform-req=php

      - name: Servir le dépôt sur 127.0.0.1:49222
        run: |
          docker run -d --name 3omar-browser-app --entrypoint php \
            -v "$PWD":/var/www/html -v 3omar_browser_vendor:/var/www/html/vendor \
            -w /var/www/html/public -p 127.0.0.1:49222:8000 \
            -e APP_ENV=local -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://127.0.0.1:49222 -e CACHE_STORE=array -e SESSION_DRIVER=file \
            -e PHP_CLI_SERVER_WORKERS=4 \
            3omar-app:latest -S 0.0.0.0:8000 -t /var/www/html/public \
            /var/www/html/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:49222/calculateur || true)
            echo "Essai $i : HTTP ${code}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs 3omar-browser-app
          exit 1

      - name: Installer les dépendances npm épinglées dans un volume dédié
        run: |
          docker run --rm -v "$PWD":/work -v 3omar_browser_node_modules:/work/node_modules -w /work \
            mcr.microsoft.com/playwright:v1.61.1-noble npm ci --no-audit --no-fund

      - name: Lancer les contrats navigateur
        env:
          CI: 'true'
        run: ./tests/browser/run.sh tests/browser/contracts

      - name: Journal du serveur PHP en cas d'échec
        if: failure()
        run: docker logs --tail 200 3omar-browser-app || true

      - name: Publier le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-navigateur
          path: |
            tests/browser/.report
            tests/browser/.output
          retention-days: 7
          if-no-files-found: ignore
          # .report et .output sont des dossiers cachés, exclus par défaut.
          include-hidden-files: true

      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f 3omar-browser-app || true
