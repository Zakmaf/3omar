services:

  # ---- PHP-FPM 8.5 - Application Laravel V1.1 ----
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: paie_maroc_v11_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:49174
      APP_VERSION: V1.1.0
    volumes:
      - .:/var/www/html
      - vendor_data_v11:/var/www/html/vendor
      - php_logs_v11:/var/log/php
    networks:
      - paie_v11_net
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Nginx 1.25 — Reverse proxy V1.1 ----
  nginx:
    image: nginx:1.25-alpine
    container_name: paie_maroc_v11_nginx
    restart: unless-stopped
    ports:
      - "49174:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - paie_v11_net

volumes:
  vendor_data_v11:
    name: paie_maroc_v11_vendor
  php_logs_v11:
    name: paie_maroc_v11_logs

networks:
  paie_v11_net:
    driver: bridge
    name: paie_maroc_v11_network
