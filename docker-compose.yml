services:

  # ---- PHP-FPM 8.4 — Application Laravel ----
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: paie_maroc_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV:   local
      APP_DEBUG: "true"
      APP_URL:   http://localhost:49173
    volumes:
      # Montage du code source (hot-reload en développement)
      - .:/var/www/html
      # Volume anonyme pour que le dossier vendor de l'image ne soit
      # pas écrasé par le montage de l'hôte (qui n'a pas de vendor/)
      - vendor_data:/var/www/html/vendor
      # Logs PHP persistants
      - php_logs:/var/log/php
    networks:
      - paie_net
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Nginx 1.25 — Reverse proxy vers PHP-FPM ----
  nginx:
    image: nginx:1.25-alpine
    container_name: paie_maroc_nginx
    restart: unless-stopped
    ports:
      - "49173:80"
    volumes:
      # Code source (pour servir les fichiers statiques directement)
      - .:/var/www/html:ro
      # Configuration Nginx personnalisée
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - paie_net

# ---- Volumes persistants ----
volumes:
  vendor_data:
    name: paie_maroc_vendor
  php_logs:
    name: paie_maroc_logs

# ---- Réseau isolé ----
networks:
  paie_net:
    driver: bridge
    name: paie_maroc_network
